# Scrapes every api and worker container (Docker DNS returns one address per replica).
global:
  scrape_interval: 5s
  evaluation_interval: 15s
scrape_configs:
  - job_name: relay-api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9091
  - job_name: relay-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9091
