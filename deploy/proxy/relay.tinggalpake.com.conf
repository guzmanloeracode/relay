# relay.tinggalpake.com: the Relay API, its reference (/docs) and landing page.
# The api container listens only on 127.0.0.1:8098; /metrics is on another port and never proxied. Install:
#   cp deploy/proxy/relay.tinggalpake.com.conf /etc/nginx/sites-available/relay.tinggalpake.com
#   ln -s ../sites-available/relay.tinggalpake.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d relay.tinggalpake.com      # adds the 443 server and the redirect
server {
    listen 80;
    listen [::]:80;
    server_name relay.tinggalpake.com;

    access_log /var/log/nginx/relay.tinggalpake.access.log;
    error_log  /var/log/nginx/relay.tinggalpake.error.log;

    server_tokens off;

    # Real visitor IP: trust CF-Connecting-IP only from Cloudflare ranges (https://www.cloudflare.com/ips/).
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Relay caps request bodies at 512 KB itself; this only stops larger ones early.
    client_max_body_size 1m;

    gzip on;
    gzip_types application/json application/problem+json application/yaml text/css text/plain;

    location / {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
